[project]
name = "mirae-docling-cli-parser"
version = "0.1.0"
description = "Script-first Docling parser with fixed local and NAVER CLOVA OCR profiles"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling[easyocr]>=2.117,<2.118",
    "httpx>=0.28,<1",
    "numpy>=1.26,<2",
    "pydantic>=2.12,<3",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "transformers>=4.57,<5",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[project.entry-points."docling"]
mirae_naver_ocr = "docling_team_parser.ocr.naver_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docling_team_parser"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
