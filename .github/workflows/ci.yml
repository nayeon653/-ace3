name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint (ruff)
        run: uv run --frozen ruff check .

      - name: Check format (ruff)
        run: uv run --frozen ruff format --check .

      - name: Type check (mypy)
        run: uv run --frozen mypy pension_agent

      - name: Test (pytest)
        run: uv run --frozen pytest -q

      - name: Build package
        run: uv build

      - name: Verify installed package
        working-directory: /tmp
        run: >-
          uv run --isolated --no-project
          --with "$GITHUB_WORKSPACE"/dist/pension_agent-*.whl
          python -c
          'from importlib import resources; import pension_agent.api.app;
          import pension_agent.retrieval;
          root = resources.files("pension_agent");
          assert root.joinpath("config", "defaults").is_dir();
          assert root.joinpath("prompts").is_dir()'

# 전체 평가셋 회귀 테스트는 HCX 호출 비용이 있으므로 평가 하네스 구현 후
# 수동 실행(workflow_dispatch) 워크플로로 분리한다.
