name: 작업
description: 기능, 개선, 문서화 등 계획된 작업을 등록합니다.
body:
  - type: markdown
    attributes:
      value: |
        ### 🧭 작성 원칙

        - 긴 문단 대신 표, 체크리스트, 짧은 항목으로 작성합니다.
        - 완료 여부를 확인할 수 있는 기준을 포함합니다.
        - 복잡한 관계나 흐름은 표, Mermaid 또는 이미지로 표현합니다.

  - type: textarea
    id: objective
    attributes:
      label: 🎯 작업 목적
      description: 해결할 대상과 기대 결과를 각각 한 줄로 작성해 주세요.
      value: |
        - 해결 대상:
        - 기대 결과:
    validations:
      required: true

  - type: dropdown
    id: work_type
    attributes:
      label: 🏷️ 작업 종류
      description: 이슈 생성 후 같은 이름의 라벨을 적용합니다.
      options:
        - feature - 새로운 기능 또는 사용자 가치
        - docs - 문서 작성과 수정
        - chore - 저장소, CI, 개발환경 정비
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 🗺️ 영향 범위
      description: 해당하지 않는 항목에는 없음으로 표시해 주세요.
      value: |
        | 구분 | 대상 |
        | --- | --- |
        | 코드·모듈 |  |
        | API·데이터 |  |
        | 문서·운영 |  |
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 🛠️ 작업 범위
      description: 구현할 항목을 검증 가능한 체크리스트로 작성해 주세요.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 🚧 제외 범위
      description: 이번 작업에서 다루지 않을 항목을 작성해 주세요.
      value: |
        -

  - type: textarea
    id: acceptance
    attributes:
      label: ✅ 완료 조건
      description: 리뷰어가 완료 여부를 판단할 수 있는 기준을 체크리스트로 작성해 주세요.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: 🔗 관련 작업과 의존성
      description: 해당 사항이 없으면 없음으로 표시해 주세요.
      value: |
        - 관련 이슈:
        - 선행 작업:
        - 차단 요소:

  - type: textarea
    id: visual_materials
    attributes:
      label: 🖼️ 시각 자료
      description: 복잡한 처리 흐름은 Mermaid, 비교 정보는 표, UI는 이미지로 첨부해 주세요. 단순 작업이면 생략할 수 있습니다.
      placeholder: Mermaid 다이어그램, 표, 화면 캡처 또는 관련 설계 링크
