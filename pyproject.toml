[project]
name = "pension-agent"
version = "0.1.0"
description = "Pension document retrieval and answer agent for the 2026 Mirae Asset AI Festival"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "httpx",
    "kiwipiepy",
    "langchain>=1,<2",
    "langchain-naver>=0.1,<1",
    "langgraph>=1,<2",
    "numpy",
    "pydantic",
    "pydantic-settings>=2,<3",
    "python-dotenv",
    "pyyaml",
    "rank-bm25",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pension_agent"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tools/docling_parser"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.12"
files = ["pension_agent"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
